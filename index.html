<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    
    <title>CineIA - Assistente de Recomendações</title>
</head>
<body>
    <header class="topo">  
        <H1>CINE<span>IA</span></H1>
        <p>Assistente de recomendações Netflix</p>
    </header>

    <!--Área de configuração do API-->
    <section class="config">
        <H2>1. Configure sua conexão com a Azure</H2>

        <label for="endpoint">Endpoint do recurso</label>
        <input type="text" id="endpoint" placeholder="https://seu-recurso.openai.azure.com">

        <label for="deployment">Nome do deployment</label>
        <input type="text" id="deployment" placeholder="gpt-5">

        <label for="apikey">Chave da API</label>
        <input type="password" id="apiKey" placeholder="Cole sua chave aqui">

        <button id="btnSalvar">Salvar configuração</button>
        <span id="statusConfig"></span>
    </section>

    <!--Área do chat-->
    <section class="chat">
        <h2>2. Converse com o Assistente</h2>
        <div id="mensagens" class="mensagens">
            <div class="msg bot">
                Olá! Eu sou o CineIA
                Me conta o que você ja assistiu e gostou, ou o clima que você quer hoje
                (ação, comédia, suspense...) que eu te indico algo para ver.
            </div>
        </div>

        <form id="formchat" class="form-chat">
            <input type="text" id="campoMensagem" placeholder="Ex: Quero algo parecido com Stranger Things" autocomplete="off">
            <button type="submit">Enviar</button>
        </form>
    </section>

<script src="script.js"></script>
</body>
</html>
